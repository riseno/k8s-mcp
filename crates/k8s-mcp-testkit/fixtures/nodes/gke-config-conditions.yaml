# condition the rules do not know.
apiVersion: v1
kind: Node
metadata:
  name: gke-dev-pool-1-abcd
  labels: {cloud.google.com/gke-nodepool: pool-1}
spec: {providerID: "gce://cmg-dev/us-west1-a/gke-dev-pool-1-abcd"}
status:
  allocatable: {cpu: "4", memory: 14Gi, pods: "110"}
  nodeInfo: {kubeletVersion: v1.35.2-gke.1000}
  conditions:
