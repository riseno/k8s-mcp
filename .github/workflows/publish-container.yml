name: publish-container

# Called by release.yml (dist `publish-jobs`) after the GitHub Release exists. Builds the
# multi-arch image from the release's musl binaries, pushes it to ghcr.io, signs it with
# cosign keyless (GitHub OIDC), attests its provenance, and attaches SPDX SBOMs and a signed
# checksum bundle to the release. Signing and attestation run only for public repos: cosign
# keyless writes to Sigstore's public transparency log, and GitHub attestations need a public
# repo on Free/Pro/Team plans. Pre-releases do not move `:latest`. The Helm chart is pushed
# to oci://ghcr.io/<owner>/charts/k8s-mcp with the release version as chart and app version.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write # gh release upload
  packages: write # push to ghcr.io
  id-token: write # cosign keyless and attestations
  attestations: write

jobs:
  container:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib
          merge-multiple: true
      - name: Unpack the musl binaries per platform
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/k8s-mcp" >> "$GITHUB_ENV"
          for p in amd64:x86_64 arm64:aarch64; do
            dir="target/docker/linux/${p%%:*}"
            mkdir -p "$dir"
            tar xJf "target/distrib/k8s-mcp-server-${p#*:}-unknown-linux-musl.tar.xz" --strip-components 1 -C "$dir"
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: target/docker
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}${{ !fromJson(inputs.plan).announcement_is_prerelease && format(',{0}:latest', env.IMAGE) || '' }}
      - uses: sigstore/cosign-installer@v4.1.3
        if: github.event.repository.private == false
      - name: Sign the image and the release checksums
        if: github.event.repository.private == false
        run: |
          cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
          cosign sign-blob --yes --bundle target/distrib/sha256.sum.sigstore.json target/distrib/sha256.sum
      - name: Push (and sign) the Helm chart
        run: |
          version="${TAG#v}"
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"$GH_TOKEN"
          helm package deploy/helm/k8s-mcp --version "$version" --app-version "$version" -d target/chart
          # The chart's default image must be the one just pushed (issue #45).
          image=$(helm template k8s-mcp "target/chart/k8s-mcp-$version.tgz" | awk '$1 == "image:" {gsub(/"/, "", $2); print $2}')
          test "$image" = "$IMAGE:$TAG" || { echo "the chart's default image is $image, not $IMAGE:$TAG" >&2; exit 1; }
          docker buildx imagetools inspect "$image" >/dev/null
          digest=$(helm push "target/chart/k8s-mcp-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" 2>&1 | tee /dev/stderr | awk '/^Digest:/ {print $2}')
          if [ "${{ github.event.repository.private }}" = false ]; then
            cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/k8s-mcp@$digest"
          fi
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.private == false
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: target/k8s-mcp-image.spdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: target/k8s-mcp-crates.spdx.json
          upload-artifact: false
      - name: Attach SBOMs and the checksum signature to the release
        run: |
          files=(target/k8s-mcp-image.spdx.json target/k8s-mcp-crates.spdx.json)
          if [ -f target/distrib/sha256.sum.sigstore.json ]; then files+=(target/distrib/sha256.sum.sigstore.json); fi
          gh release upload "$TAG" "${files[@]}"
