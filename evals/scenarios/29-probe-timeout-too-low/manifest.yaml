apiVersion: v1
kind: Namespace
metadata: {name: eval-probe-timeout-too-low}
---
apiVersion: v1
kind: Pod
metadata: {name: api, namespace: eval-probe-timeout-too-low}
spec:
  containers:
    - name: api
      image: busybox:1.37
      command: [sleep, "3600"]
      # The check takes 3s; timeoutSeconds is the default 1.
      readinessProbe:
        exec: {command: [sh, -c, "sleep 3"]}
        periodSeconds: 5
