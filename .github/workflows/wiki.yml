name: wiki

# Publishes docs/ to the repository's GitHub wiki whenever they change on main. The wiki is
# fully regenerated, so pages removed from docs/ disappear from the wiki too.
# One-time setup: enable the wiki and create its first page in the web UI (GitHub creates the
# wiki's git repository only then).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/scripts/docs-to-wiki.sh"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write # GITHUB_TOKEN may push to this repository's wiki

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the wiki exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" >/dev/null 2>&1; then
            echo "::error::The wiki has no git repository yet. Open https://github.com/${GITHUB_REPOSITORY}/wiki, create the first page, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - name: Render docs as wiki pages
        run: |
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          .github/scripts/docs-to-wiki.sh docs wiki "$GITHUB_REPOSITORY"
      - name: Commit and push if changed
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: sync from ${GITHUB_SHA::7}"
          git push
