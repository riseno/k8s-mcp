name: docs

# Builds the docs site (mdBook, book.toml) on every docs change, failing on mdBook warnings, and
# publishes it to GitHub Pages from main.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["docs/**", "book.toml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "book.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          curl -sSfL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin mdbook
      - name: Build
        run: |
          mdbook build 2>&1 | tee build.log
          if grep -q WARN build.log; then echo "::error::mdBook warnings (see above)"; exit 1; fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
