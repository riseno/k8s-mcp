apiVersion: v1
kind: Namespace
metadata: {name: eval-autoscaler-cannot-scale}
---
# Too big for any node; on a cluster with the Cluster Autoscaler the only node group is at
# its maximum size. kind has no autoscaler, so the scenario applies the event CA would emit.
apiVersion: v1
kind: Pod
metadata: {name: batch, namespace: eval-autoscaler-cannot-scale}
spec:
  containers:
    - name: batch
      image: busybox:1.37
      command: [sleep, "3600"]
      resources: {requests: {cpu: "64"}}
---
apiVersion: v1
kind: Event
metadata: {name: batch.ntsu, namespace: eval-autoscaler-cannot-scale}
involvedObject: {apiVersion: v1, kind: Pod, name: batch, namespace: eval-autoscaler-cannot-scale}
reason: NotTriggerScaleUp
type: Normal
source: {component: cluster-autoscaler}
message: "pod didn't trigger scale-up: 1 max node group size reached"
count: 6
