# targetPort 8080, but the container (nginx) declares and listens on 80.
apiVersion: v1
kind: Service
metadata: {name: front, namespace: shop, creationTimestamp: "2026-11-14T10:00:00Z"}
spec:
  selector: {app: front}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata: {name: front-5d4c3-zx9yw, namespace: shop, labels: {app: front}, creationTimestamp: "2026-11-14T11:00:00Z"}
spec:
  nodeName: node-1
  containers:
    - name: app
      image: ghcr.io/acme/app:1.4
      ports: [{containerPort: 80}]
status:
  phase: Running
  conditions:
    - {type: Ready, status: "True"}
  containerStatuses:
    - {name: app, ready: true, restartCount: 0, image: ghcr.io/acme/app:1.4, imageID: "", state: {running: {startedAt: "2026-11-14T11:00:10Z"}}}
