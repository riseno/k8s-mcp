name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Not yet here (nothing to check): per-provider feature builds (v0.2) and the mdBook docs build.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Shared with the integration evals (same debug build).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: cargo test --workspace
      - name: Lite build
        run: cargo build -p k8s-mcp-server --no-default-features

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.23.0
      - run: cargo deny --locked check # also bans OpenSSL and aws-lc (ADR 0001)
      - run: cargo audit

  musl:
    runs-on: ubuntu-latest
    container: ghcr.io/rust-cross/cargo-zigbuild:0.24.1
    env:
      BIN: target/x86_64-unknown-linux-musl/release/k8s-mcp
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Release builds are large: only main saves this cache; PRs restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo zigbuild --locked --release -p k8s-mcp-server --target x86_64-unknown-linux-musl
      - name: Assert static linking
        run: |
          file "$BIN" | tee /dev/stderr | grep -q 'statically linked'
          ldd "$BIN" 2>&1 | tee /dev/stderr | grep -q 'not a dynamic executable'
      - name: Binary size
        run: |
          echo "k8s-mcp x86_64-unknown-linux-musl (stripped): $(stat -c %s "$BIN") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      # The chart jobs install this binary, so nothing builds it twice.
      - uses: actions/upload-artifact@v7
        with:
          name: k8s-mcp-linux-amd64
          path: ${{ env.BIN }}
          retention-days: 1

  # Install the chart with the binary above on kind and k3s, and smoke-test the HTTP endpoint.
  chart:
    name: chart on ${{ matrix.cluster }}
    needs: musl
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: [kind, k3s]
    env:
      CHART: deploy/helm/k8s-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: k8s-mcp-linux-amd64
          path: image/linux/amd64
      - name: Build the image
        run: docker build --platform linux/amd64 -t k8s-mcp:ci -f Dockerfile image
      - name: Lint and validate the rendered chart
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          helm lint "$CHART"
          for values in "" \
            "--set auth.mode=static --set auth.existingSecret=token" \
            "--set networkPolicy.enabled=true --set networkPolicy.apiServerCIDRs={10.0.0.1/32} --set podDisruptionBudget.enabled=true --set rbac.secretsMetadata=false" \
            "--set auth.audience= --set auth.allowedCallers={system:serviceaccount:platform:*,group:sre}" \
            "--set writes.enabled=true --set writes.destructive=true --set auth.allowedCallers={group:sre}"; do
            # shellcheck disable=SC2086 # $values holds several flags
            helm template t "$CHART" $values | ./kubeconform -strict -summary -kubernetes-version 1.33.0
          done
      - if: matrix.cluster == 'kind'
        uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          cluster_name: chart
      - if: matrix.cluster == 'kind'
        run: |
          kind load docker-image k8s-mcp:ci --name chart
          echo "CONTEXT=kind-chart" >> "$GITHUB_ENV"
      - if: matrix.cluster == 'k3s'
        run: |
          curl -sSfLo /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          chmod +x /usr/local/bin/k3d
          k3d cluster create chart --wait
          k3d image import k8s-mcp:ci -c chart
          echo "CONTEXT=k3d-chart" >> "$GITHUB_ENV"
      - name: Install the chart
        run: |
          helm install k8s-mcp "$CHART" --kube-context "$CONTEXT" -n k8s-mcp --create-namespace \
            --set image.repository=k8s-mcp --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 3m
      - run: deploy/helm/smoke.sh "$HOME/.kube/config" "$CONTEXT" k8s-mcp k8s-mcp
      - name: Enable writes and smoke-test a planned and confirmed restart
        run: |
          helm upgrade k8s-mcp "$CHART" --kube-context "$CONTEXT" -n k8s-mcp --reuse-values \
            --set writes.enabled=true --set 'auth.allowedCallers={system:serviceaccount:default:mcp-caller}' --wait --timeout 3m
          WRITES=1 deploy/helm/smoke.sh "$HOME/.kube/config" "$CONTEXT" k8s-mcp k8s-mcp
      - if: failure()
        run: |
          kubectl --context "$CONTEXT" -n k8s-mcp describe pods
          kubectl --context "$CONTEXT" -n k8s-mcp logs deploy/k8s-mcp --tail 100
