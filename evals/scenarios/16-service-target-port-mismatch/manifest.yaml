apiVersion: v1
kind: Namespace
metadata: {name: eval-service-target-port-mismatch}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: front, namespace: eval-service-target-port-mismatch}
spec:
  replicas: 1
  selector: {matchLabels: {app: front}}
  template:
    metadata: {labels: {app: front}}
    spec:
      containers:
        - name: front
          image: nginx:1.31-alpine
          ports: [{containerPort: 80}]
---
# nginx listens on 80; the Service sends traffic to 8080.
apiVersion: v1
kind: Service
metadata: {name: front, namespace: eval-service-target-port-mismatch}
spec:
  selector: {app: front}
  ports: [{name: http, port: 80, targetPort: 8080}]
