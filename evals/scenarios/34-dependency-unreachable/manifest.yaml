apiVersion: v1
kind: Namespace
metadata: {name: eval-dependency-unreachable}
---
apiVersion: v1
kind: Pod
metadata: {name: api, namespace: eval-dependency-unreachable}
spec:
  containers:
    - name: api
      image: busybox:1.37
      # Nothing listens on 5432: the connect is refused and the app exits.
      command:
        - sh
        - -c
        - |
          echo 'connecting to postgres at 127.0.0.1:5432'
          nc -w 2 127.0.0.1 5432 </dev/null || echo 'FATAL: connection to server at "127.0.0.1", port 5432 failed: Connection refused'
          exit 1
