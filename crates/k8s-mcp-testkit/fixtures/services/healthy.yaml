# Selector, named targetPort and readiness all line up; the LoadBalancer has an address.
apiVersion: v1
kind: Service
metadata: {name: checkout, namespace: shop, creationTimestamp: "2026-11-14T10:00:00Z"}
spec:
  type: LoadBalancer
  selector: {app: checkout}
  ports: [{name: https, port: 443, targetPort: https}]
status:
  loadBalancer: {ingress: [{ip: 203.0.113.10}]}
---
apiVersion: v1
kind: Pod
metadata: {name: checkout-1a2b3-c4d5e, namespace: shop, labels: {app: checkout}, creationTimestamp: "2026-11-14T11:00:00Z"}
spec:
  nodeName: node-1
  containers:
    - name: app
      image: ghcr.io/acme/app:1.4
      ports: [{name: https, containerPort: 8443}]
status:
  phase: Running
  conditions:
    - {type: Ready, status: "True"}
  containerStatuses:
    - {name: app, ready: true, restartCount: 0, image: ghcr.io/acme/app:1.4, imageID: "", state: {running: {startedAt: "2026-11-14T11:00:10Z"}}}
---
apiVersion: v1
kind: Pod
metadata: {name: checkout-1a2b3-f6g7h, namespace: shop, labels: {app: checkout}, creationTimestamp: "2026-11-14T11:00:00Z"}
spec:
  nodeName: node-1
  containers:
    - name: app
      image: ghcr.io/acme/app:1.4
      ports: [{name: https, containerPort: 8443}]
status:
  phase: Running
  conditions:
    - {type: Ready, status: "False", reason: ContainersNotReady}
  containerStatuses:
    - {name: app, ready: false, restartCount: 0, image: ghcr.io/acme/app:1.4, imageID: "", state: {running: {startedAt: "2026-11-14T11:00:10Z"}}}
