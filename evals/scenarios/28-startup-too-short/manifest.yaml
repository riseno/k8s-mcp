apiVersion: v1
kind: Namespace
metadata: {name: eval-startup-too-short}
---
apiVersion: v1
kind: Pod
metadata: {name: api, namespace: eval-startup-too-short}
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: api
      image: busybox:1.37
      # Takes 30s to start; the startup probe gives it 6s.
      command: [sh, -c, "echo warming caches; sleep 30; touch /tmp/ready; sleep 3600"]
      startupProbe:
        exec: {command: [test, -f, /tmp/ready]}
        periodSeconds: 2
        failureThreshold: 3
