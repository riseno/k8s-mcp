apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-mcp.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --transport=http
            - --listen=0.0.0.0:8080
            - --in-cluster
            - --auth={{ .Values.auth.mode }}
            {{- if eq .Values.auth.mode "static" }}
            - --auth-token-file=/var/run/k8s-mcp/auth/token
            {{- end }}
            - --allowed-hosts={{ include "k8s-mcp.allowedHosts" . }}
            {{- with .Values.allowedOrigins }}
            - --allowed-origins={{ join "," . }}
            {{- end }}
            - --redact={{ .Values.redact }}
            - --log-level={{ .Values.logLevel }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if eq .Values.auth.mode "static" }}
          volumeMounts:
            - name: auth
              mountPath: /var/run/k8s-mcp/auth
              readOnly: true
          {{- end }}
      {{- if eq .Values.auth.mode "static" }}
      volumes:
        - name: auth
          secret:
            secretName: {{ required "auth.existingSecret is required when auth.mode is static" .Values.auth.existingSecret }}
            items:
              - key: token
                path: token
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
