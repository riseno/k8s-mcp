apiVersion: v1
kind: Namespace
metadata:
  name: eval-pod-security-rejected
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: eval-pod-security-rejected}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    # No securityContext: violates the restricted profile.
    spec: {containers: [{name: web, image: "nginx:1.31-alpine"}]}
