apiVersion: v1
kind: Namespace
metadata: {name: eval-quota-exceeded}
---
# The ResourceQuota (setup.yaml) allows 250m of CPU requests: of two replicas of 200m each,
# it admits only the first pod.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: eval-quota-exceeded}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: nginx:1.31-alpine
          resources:
            requests: {cpu: 200m}
