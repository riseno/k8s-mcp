apiVersion: v1
kind: Namespace
metadata: {name: eval-topology-spread}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: eval-topology-spread, labels: {app: web}}
spec:
  # Spread across zones, on a cluster whose nodes carry no zone label.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector: {matchLabels: {app: web}}
  containers: [{name: web, image: "registry.k8s.io/pause:3.10"}]
