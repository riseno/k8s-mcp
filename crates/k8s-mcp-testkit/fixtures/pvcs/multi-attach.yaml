# The new pod cannot attach the RWO volume: the old node still holds it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data, namespace: shop, creationTimestamp: "2026-11-14T11:40:00Z"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
  storageClassName: gp3
  volumeName: pvc-3f2a
status: {phase: Bound}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: gp3, annotations: {storageclass.kubernetes.io/is-default-class: "true"}}
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: Pod
metadata: {name: web-2, namespace: shop, creationTimestamp: "2026-11-14T11:40:00Z"}
spec:
  containers: [{name: db, image: postgres:17}]
  volumes: [{name: data, persistentVolumeClaim: {claimName: data}}]
status: {phase: Pending}
---
apiVersion: v1
kind: Event
metadata: {name: web-2.1, namespace: shop}
involvedObject: {kind: Pod, name: web-2, namespace: shop}
type: Warning
reason: FailedAttachVolume
message: 'Multi-Attach error for volume "pvc-3f2a" Volume is already exclusively attached to one node and can''t be attached to another'
count: 3
