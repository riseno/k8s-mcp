apiVersion: v1
kind: Namespace
metadata: {name: eval-pvc-unbound}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data, namespace: eval-pvc-unbound}
spec:
  storageClassName: does-not-exist
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Pod
metadata: {name: db, namespace: eval-pvc-unbound}
spec:
  containers:
    - name: db
      image: busybox:1.38
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts: [{name: data, mountPath: /data}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: data}
