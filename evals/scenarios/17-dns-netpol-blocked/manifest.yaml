apiVersion: v1
kind: Namespace
metadata: {name: eval-dns-netpol-blocked}
---
# The client may only talk to the database: the egress policy forgets DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: client-egress, namespace: eval-dns-netpol-blocked}
spec:
  podSelector: {matchLabels: {app: client}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: db}}}]
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: eval-dns-netpol-blocked, labels: {app: client}}
spec:
  containers:
    - name: client
      image: busybox:1.37
      command: [sh, -c, "while true; do nslookup -timeout=2 kubernetes.default.svc.cluster.local || true; sleep 5; done"]
