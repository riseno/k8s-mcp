apiVersion: v1
kind: Namespace
metadata: {name: eval-hpa-not-scaling}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: eval-hpa-not-scaling}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    # No CPU request: a CPU utilization target cannot be computed.
    spec: {containers: [{name: checkout, image: "registry.k8s.io/pause:3.10"}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: checkout, namespace: eval-hpa-not-scaling}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: checkout}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
