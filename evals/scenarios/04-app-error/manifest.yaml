apiVersion: v1
kind: Namespace
metadata: {name: eval-app-error}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: eval-app-error}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - name: orders
          image: python:3.14-alpine
          command:
            - python
            - -c
            - |
              def connect(url):
                  raise ConnectionError(f"could not connect to database at {url}")
              print("orders service starting", flush=True)
              connect("postgres://db.eval-app-error.svc:5432/orders")
