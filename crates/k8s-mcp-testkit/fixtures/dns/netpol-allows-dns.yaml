# Same policy, plus one that allows DNS to kube-system: DNS works.
---
apiVersion: v1
kind: Pod
metadata: {name: api-6d5f4-xk2p9, namespace: shop, labels: {app: api}, creationTimestamp: "2026-11-14T11:00:00Z"}
spec: {containers: [{name: api, image: ghcr.io/acme/api:3.1}]}
status: {phase: Running}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-egress, namespace: shop}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: db}}}]
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: shop}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: v1
kind: Pod
metadata: {name: coredns-7db6d-aaaaa, namespace: kube-system, labels: {k8s-app: kube-dns}, creationTimestamp: "2026-11-14T08:00:00Z"}
spec: {containers: [{name: coredns, image: registry.k8s.io/coredns/coredns:v1.12.1}]}
status:
  phase: Running
  conditions: [{type: Ready, status: "True"}]
  containerStatuses: [{name: coredns, ready: true, restartCount: 0, image: coredns, imageID: "", state: {running: {startedAt: "2026-11-14T08:00:05Z"}}}]
---
apiVersion: v1
kind: Service
metadata: {name: kube-dns, namespace: kube-system}
spec:
  clusterIP: 10.96.0.10
  selector: {k8s-app: kube-dns}
  ports: [{name: dns, port: 53, protocol: UDP}, {name: dns-tcp, port: 53, protocol: TCP}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: {name: kube-dns-x1, namespace: kube-system, labels: {kubernetes.io/service-name: kube-dns}}
addressType: IPv4
endpoints:
  - {addresses: [10.244.0.2], conditions: {ready: true}}
