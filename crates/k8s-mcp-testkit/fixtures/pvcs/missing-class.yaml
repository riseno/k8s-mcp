# The claim names StorageClass fast-ssd; the cluster only has standard.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data, namespace: shop, creationTimestamp: "2026-11-14T11:40:00Z"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
  storageClassName: fast-ssd
status: {phase: Pending}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: standard, annotations: {storageclass.kubernetes.io/is-default-class: "true"}}
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: Pod
metadata: {name: db-0, namespace: shop, creationTimestamp: "2026-11-14T11:40:00Z"}
spec:
  containers: [{name: db, image: postgres:17}]
  volumes: [{name: data, persistentVolumeClaim: {claimName: data}}]
status: {phase: Pending}
