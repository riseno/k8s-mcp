{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.apiServerCIDRs }}
{{- fail "networkPolicy.apiServerCIDRs is required when networkPolicy.enabled is true (an empty list would allow egress to every address)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # API server
    - to:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
