apiVersion: v1
kind: Namespace
metadata: {name: eval-node-selector-mismatch}
---
apiVersion: v1
kind: Pod
metadata: {name: indexer, namespace: eval-node-selector-mismatch}
spec:
  nodeSelector: {disktype: ssd}
  containers:
    - name: indexer
      image: busybox:1.38
      command: ["sh", "-c", "sleep 3600"]
