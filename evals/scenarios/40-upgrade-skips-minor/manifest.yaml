apiVersion: v1
kind: Namespace
metadata: {name: eval-upgrade-skips-minor}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: eval-upgrade-skips-minor}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec: {containers: [{name: web, image: "registry.k8s.io/pause:3.10"}]}
