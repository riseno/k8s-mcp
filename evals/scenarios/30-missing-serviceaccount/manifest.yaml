apiVersion: v1
kind: Namespace
metadata: {name: eval-missing-serviceaccount}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: builder, namespace: eval-missing-serviceaccount}
spec:
  replicas: 1
  selector: {matchLabels: {app: builder}}
  template:
    metadata: {labels: {app: builder}}
    spec:
      serviceAccountName: build-bot
      containers: [{name: builder, image: "registry.k8s.io/pause:3.10"}]
