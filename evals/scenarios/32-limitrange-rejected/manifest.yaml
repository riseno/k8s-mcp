apiVersion: v1
kind: Namespace
metadata: {name: eval-limitrange-rejected}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: eval-limitrange-rejected}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 100m}, limits: {cpu: "1"}}
