name: integration

on:
  pull_request:
    paths:
      - "crates/**"
      - "xtask/**"
      - "evals/**"
      - "Cargo.lock"
      - ".github/workflows/integration.yml"
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR cancels the running evals.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kind:
    name: kind ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest node images published with kind v0.33.0 (pinned by digest).
        include:
          - k8s: "1.34"
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - k8s: "1.37"
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Same debug-build cache as ci's test job, which main saves: PRs start warm.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          install_only: true
      # Creates the cluster with its audit log (xtask/kind/audit-policy.yaml), writes
      # .dev/kubeconfig and installs metrics-server.
      - run: cargo xtask kind-up
        env:
          K8S_MCP_KIND_IMAGE: ${{ matrix.image }}
      # The kind acceptance tests, including the write-safety check against the API server's
      # audit log (written by root inside the node container).
      - run: sudo chmod a+rx .dev/audit && sudo chmod a+r .dev/audit/audit.log
      - run: cargo test -p k8s-mcp-server --all-features --test kind --test stdio -- --ignored
      - run: cargo xtask eval
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results-k8s-${{ matrix.k8s }}
          path: evals/results/
          if-no-files-found: ignore
