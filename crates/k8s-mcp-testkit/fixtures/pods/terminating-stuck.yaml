# Deleted 25 minutes past its grace period, with a finalizer, on a node that stopped reporting.
apiVersion: v1
kind: Pod
metadata:
  name: cache-0
  namespace: shop
  creationTimestamp: "2026-11-13T09:00:00Z"
  deletionTimestamp: "2026-11-14T11:35:00Z"
  deletionGracePeriodSeconds: 30
  finalizers: [example.com/cache-flush]
spec:
  nodeName: node-2
  containers:
    - name: cache
      image: redis:7.4
status:
  phase: Running
  containerStatuses:
    - name: cache
      ready: true
      restartCount: 0
      image: redis:7.4
      state: {running: {startedAt: "2026-11-13T09:00:05Z"}}
---
apiVersion: v1
kind: Node
metadata: {name: node-2}
status:
  conditions:
    - {type: Ready, status: Unknown, reason: NodeStatusUnknown, message: "Kubelet stopped posting node status."}
