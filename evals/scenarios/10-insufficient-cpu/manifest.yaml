apiVersion: v1
kind: Namespace
metadata: {name: eval-insufficient-cpu}
---
apiVersion: v1
kind: Pod
metadata: {name: batch, namespace: eval-insufficient-cpu}
spec:
  containers:
    - name: batch
      image: busybox:1.38
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: {cpu: "64"}
