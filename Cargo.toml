[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/riseno/k8s-mcp"
authors = ["Ryan Chan"]

[workspace.dependencies]
k8s-mcp-core = { path = "crates/k8s-mcp-core" }
k8s-mcp-diagnose = { path = "crates/k8s-mcp-diagnose" }
k8s-mcp-tools = { path = "crates/k8s-mcp-tools" }
k8s-mcp-testkit = { path = "crates/k8s-mcp-testkit" }
k8s-mcp-provider = { path = "crates/k8s-mcp-provider" }
k8s-mcp-provider-eks = { path = "crates/k8s-mcp-provider-eks" }
k8s-mcp-provider-gke = { path = "crates/k8s-mcp-provider-gke" }
k8s-mcp-provider-aks = { path = "crates/k8s-mcp-provider-aks" }

rmcp = { version = "3.10", features = ["server", "macros", "schemars", "transport-io"] }
kube = { version = "5.1", default-features = false, features = ["client", "config", "rustls-tls", "ring", "gzip"] }
k8s-openapi = { version = "0.29", features = ["v1_33"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time", "io-std"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1"
# HMAC-SHA256 confirm tokens for write tools (v0.4, decision 1); already the TLS crypto provider.
ring = "0.17"
# Helm release records are gzip-compressed (v1.0 decision 2).
flate2 = "1.1"
# Kills a stalled exec plugin's process group (ADR 0014, riseno/k8s-mcp#89); Unix only.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }
schemars = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
regex = "1.13"
globset = "0.4"
jiff = "0.2"
tower-test = "0.4"
http = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
# AWS SDK on rustls + ring (ADR 0007): default features off, HTTP client from
# aws-smithy-http-client. No `credentials-process`: k8s-mcp runs no commands but kubeconfig
# exec plugins.
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio", "sso", "behavior-version-latest"] }
aws-sdk-eks = { version = "1.162", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-sts = { version = "1.126", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-iam = { version = "1.136", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-cloudwatchlogs = { version = "1.165", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-ring"] }
aws-smithy-mocks = "0.3"
# Google Cloud SDK on rustls + ring (v0.3 plan): every crate with default features off, since
# their defaults pull aws-lc-rs (banned in deny.toml). The binary installs the ring provider.
google-cloud-container-v1 = { version = "1.15", default-features = false }
google-cloud-iam-admin-v1 = { version = "1.14", default-features = false }
google-cloud-logging-v2 = { version = "1.16", default-features = false }
google-cloud-auth = { version = "1.19", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
wiremock = "0.6"
# Azure (v0.3 plan): our own ARM and Log Analytics calls over reqwest, tokens from
# azure_identity. Default features off: they pull aws-lc-rs (reqwest `rustls`) and OpenSSL
# (`client_certificate`). No credential type that runs a command is used (clippy.toml).
azure_core = { version = "1.1", default-features = false, features = ["reqwest", "reqwest_gzip", "tokio"] }
azure_identity = { version = "1.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
async-trait = "0.1"
aws-smithy-types = "1"
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"
assert_cmd = "2.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
print_stdout = "deny"
unwrap_used = "deny"
expect_used = "deny"
# Documented allows: noisy pedantic lints that do not improve this codebase.
module_name_repetitions = "allow" # crate-prefixed names read better at call sites
missing_errors_doc = "allow"      # errors are self-describing thiserror enums
must_use_candidate = "allow"      # too noisy for small getters
too_many_lines = "allow"          # rule tables and renderers are long by nature
similar_names = "allow"           # short names like ns/sc/cm are idiomatic in Kubernetes code
doc_markdown = "allow"            # Kubernetes kind names (ConfigMap, OOMKilled) read better without backticks

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
