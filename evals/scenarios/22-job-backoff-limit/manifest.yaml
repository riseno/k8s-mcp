apiVersion: v1
kind: Namespace
metadata: {name: eval-job-backoff-limit}
---
apiVersion: batch/v1
kind: Job
metadata: {name: report, namespace: eval-job-backoff-limit}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.37
          command: [sh, -c, "echo 'fatal: cannot open /data/report.csv: no such file or directory' >&2; exit 2"]
