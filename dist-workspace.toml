[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "riseno/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-container"]
# Custom jobs to run before the build: the release is blocked if the eval gates fail
plan-jobs = ["./evals"]
# Attest the release archives with GitHub artifact attestations. Off while the repo is private:
# on GitHub Free/Pro/Team they only work in public repos. When the repo goes public, set this to
# true and run `dist generate` (see docs/progress.md).
github-attestations = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Embed the dependency list in binaries so syft can SBOM the image
cargo-auditable = true
# The container job pushes to ghcr.io, signs keylessly, attests, and uploads SBOMs to the release
github-custom-job-permissions = { "publish-container" = { contents = "write", packages = "write", id-token = "write", attestations = "write" } }
