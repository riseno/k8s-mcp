[package]
name = "k8s-mcp-tools"
description = "Kubernetes read and diagnose tool implementations for k8s-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The Amazon EKS provider tools (eks_*).
provider-eks = ["dep:k8s-mcp-provider", "dep:k8s-mcp-provider-eks"]
# The Google Kubernetes Engine provider tools (gke_*).
provider-gke = ["dep:k8s-mcp-provider", "dep:k8s-mcp-provider-gke"]
# The Azure Kubernetes Service provider tools (aks_*).
provider-aks = ["dep:k8s-mcp-provider", "dep:k8s-mcp-provider-aks"]

[dependencies]
k8s-mcp-core.workspace = true
k8s-mcp-diagnose.workspace = true
k8s-mcp-provider = { workspace = true, optional = true }
k8s-mcp-provider-eks = { workspace = true, optional = true }
k8s-mcp-provider-gke = { workspace = true, optional = true }
k8s-mcp-provider-aks = { workspace = true, optional = true }
k8s-openapi.workspace = true
kube.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing.workspace = true
regex.workspace = true
jiff.workspace = true
http.workspace = true

[dev-dependencies]
k8s-mcp-testkit.workspace = true
proptest.workspace = true
insta.workspace = true
tower-test.workspace = true
