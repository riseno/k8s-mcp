apiVersion: v1
kind: Namespace
metadata: {name: eval-service-selector-mismatch}
---
# The release relabeled its pods app=web-v2; the Service still selects app=web.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: eval-service-selector-mismatch}
spec:
  replicas: 1
  selector: {matchLabels: {app: web-v2}}
  template:
    metadata: {labels: {app: web-v2}}
    spec:
      containers:
        - name: web
          image: nginx:1.31-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: eval-service-selector-mismatch}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
