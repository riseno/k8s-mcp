# The Service selects app=web, but the new release labels its pods app=web-v2.
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop, creationTimestamp: "2026-11-14T10:00:00Z"}
spec:
  type: ClusterIP
  selector: {app: web, tier: front}
  ports: [{name: http, port: 80, targetPort: 8080, protocol: TCP}]
---
apiVersion: v1
kind: Pod
metadata: {name: web-6f7d9-abcde, namespace: shop, labels: {app: web-v2, tier: front}, creationTimestamp: "2026-11-14T11:00:00Z"}
spec:
  nodeName: node-1
  containers:
    - name: app
      image: ghcr.io/acme/app:1.4
      ports: [{containerPort: 8080}]
status:
  phase: Running
  conditions:
    - {type: Ready, status: "True"}
  containerStatuses:
    - {name: app, ready: true, restartCount: 0, image: ghcr.io/acme/app:1.4, imageID: "", state: {running: {startedAt: "2026-11-14T11:00:10Z"}}}
