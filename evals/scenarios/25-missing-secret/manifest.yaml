apiVersion: v1
kind: Namespace
metadata: {name: eval-missing-secret}
---
apiVersion: v1
kind: Pod
metadata: {name: billing, namespace: eval-missing-secret}
spec:
  containers:
    - name: billing
      image: busybox:1.37
      command: [sh, -c, "sleep 3600"]
      env:
        - name: STRIPE_KEY
          valueFrom: {secretKeyRef: {name: stripe-credentials, key: api-key}}
