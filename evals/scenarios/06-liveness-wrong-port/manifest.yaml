apiVersion: v1
kind: Namespace
metadata: {name: eval-liveness-wrong-port}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: eval-liveness-wrong-port}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: nginx:1.31-alpine
          ports: [{containerPort: 80}]
          livenessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 2
            failureThreshold: 2
