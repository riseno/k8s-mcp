# Eval scenario 6: liveness probe on 8080, nginx listens on 80. nginx exits 0 on the
# kubelet's SIGTERM, so lastState is a clean exit (crashloop.exit_zero must NOT fire).
apiVersion: v1
kind: Pod
metadata: {name: web-probe-7c8d9-z1x2c, namespace: eval-x, creationTimestamp: "2026-11-14T11:45:00Z"}
spec:
  nodeName: node-1
  restartPolicy: Always
  containers:
    - name: web
      image: nginx:1.27
      ports: [{containerPort: 80, name: http}]
      livenessProbe:
        httpGet: {path: /, port: 8080}
        periodSeconds: 5
        failureThreshold: 3
status:
  phase: Running
  containerStatuses:
    - name: web
      ready: false
      restartCount: 5
      image: nginx:1.27
      state: {waiting: {reason: CrashLoopBackOff, message: "back-off 1m20s restarting failed container=web"}}
      lastState: {terminated: {exitCode: 0, reason: Completed, startedAt: "2026-11-14T11:57:00Z", finishedAt: "2026-11-14T11:57:16Z"}}
