id: pvc-unbound
symptom: The db pod in eval-pvc-unbound is Pending. What is blocking it?
tool: diagnose_pod
args: {name: db, namespace: eval-pvc-unbound}
settle_seconds: 20
expected:
  primary: pod.pending.pvc_unbound
  acceptable: []
forbidden: [pod.pending.insufficient_resources, pod.pending.node_selector_affinity, pod.pending.volume_node_affinity]
