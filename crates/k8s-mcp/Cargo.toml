[package]
name = "k8s-mcp-server"
description = "Safe, read-only-by-default MCP server for troubleshooting any Kubernetes cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
homepage = "https://github.com/riseno/k8s-mcp"
keywords = ["kubernetes", "mcp", "ai", "troubleshooting", "k8s"]
categories = ["command-line-utilities"]

[[bin]]
name = "k8s-mcp"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["http"]
# Streamable HTTP transport (`--transport http`) for in-cluster use.
http = ["dep:axum", "rmcp/transport-streamable-http-server"]

[dependencies]
k8s-mcp-core.workspace = true
k8s-mcp-diagnose.workspace = true
k8s-mcp-tools.workspace = true
anyhow.workspace = true
axum = { workspace = true, optional = true }
clap.workspace = true
clap_complete.workspace = true
http.workspace = true
jiff.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
k8s-mcp-testkit.workspace = true
tower.workspace = true
